name: tests

# The suite is CPU-only and needs no trained checkpoint, so it runs on every
# push and pull request. The optional extras (Tk, FastAPI, jupyterlab, kagglehub)
# are installed so the API and GUI suites do not silently skip themselves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Upstream releases break things silently; a weekly run says so on a Monday
  # instead of on the day someone tries to use the project.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the rules that catch real defects - undefined names, syntax that
      # does not parse, redefinitions. Formatting opinions are left alone.
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --select E9,F63,F7,F82,F811 apexgpt tests

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      # The CPU wheel: no runner needs a GPU, and the tests never use one.
      - name: Install torch (CPU build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the project and its extras
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-api.txt
          python -m pip install pytest
          # the notebook extra too: 'lab --check' below and the lab suite need
          # jupyterlab and ipykernel, and a suite that silently skips itself
          # proves nothing
          python -m pip install -e ".[notebook]"

      - name: Show what the scan resolved
        run: python -m apexgpt env --no-load-scan

      - name: Run the tests
        run: python -m pytest tests --tb=short --junitxml=pytest-report.xml

      # A failure the maintainer cannot read is a failure that cannot be fixed:
      # the report travels with the run.
      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: warn

      - name: Verify the notebook kernel spec and the package layout
        run: |
          python -m apexgpt lab --check
          python -m apexgpt doctor

  newest-python:
    name: pytest (newest python)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The matrix pins 3.11 and 3.13 to prove the floor and the version people
    # actually run; this proves the next release has not broken anything yet.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Install torch (CPU build) and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run the tests
        run: python -m pytest tests --tb=short

  smoke:
    name: end-to-end (data -> tokens -> train -> generate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The unit suite can be green while the program is unusable: a command that
    # imports fine and then fails on a real corpus. This walks the whole path a
    # newcomer takes, with the smallest settings that still train.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install torch (CPU build) and the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Build the corpus
        run: python -m apexgpt data prepare --source shakespeare --tokenizer char

      - name: Print the token table and predict from it
        run: |
          python -m apexgpt data tokens --tokenizer char --top 5
          python -m apexgpt data tokens --tokenizer char --top 5 --predict "KING RICHARD II:"

      - name: Train a real (tiny) model
        # no --tokenizer: training reads the one the corpus was built with, which
        # is the point of recording it beside the binaries
        run: >
          python -m apexgpt train --preset cpu-tiny --dataset shakespeare
          --max-iters 30 --run-name ci-smoke

      - name: Generate and predict with the checkpoint
        run: |
          python -m apexgpt generate --prompt "The history of the city is" --max-new-tokens 40 --seed 7
          python -m apexgpt generate --prompt "The history of the city is" --predict 5

      - name: Keep the artifacts of a run that worked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: |
            models/runs/**/history.json
            models/runs/**/loss_curves.png
            data/tokenizer/*.json
          if-no-files-found: warn

  package:
    name: build + install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torch (CPU build) and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build the wheel and sdist
        run: python -m build

      - name: Install the wheel and run the CLI from it
        run: |
          python -m pip install dist/apexgpt-*.whl
          apexgpt --help
          python -c "import apexgpt, apexgpt.core.paths as p; print(apexgpt.__version__, p.ROOT)"

      # A published artifact should not carry the corpus, the checkpoints or
      # the tests: the wheel is what people install.
      - name: Check what the wheel contains
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/apexgpt-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          leaked = [n for n in names
                    if n.split("/")[0] in {"tests", "notebooks", "data", "models", ".github"}]
          print(f"{wheel}: {len(names)} entries")
          assert not leaked, f"the wheel carries project files: {leaked}"
          print("wheel is clean")
          PY

      - name: Publish the wheel as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error