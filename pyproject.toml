[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apexgpt"
version = "1.2.0"
description = "A GPT-style transformer language model built from scratch in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["llm", "gpt", "transformer", "pytorch", "nlp", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch is deliberately unpinned: the right build depends on the hardware and
# OS, which is what `python -m apexgpt setup` resolves. See requirements.txt.
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6", "httpx>=0.27"]
hub = ["kagglehub>=0.3"]
notebook = ["jupyterlab>=4.2", "ipykernel>=6.29"]
dev = ["pytest>=8.0"]

[project.scripts]
apexgpt = "apexgpt.__main__:main"

[project.urls]
Repository = "https://github.com/Gethubsathvik/ApexGPT"
Issues = "https://github.com/Gethubsathvik/ApexGPT/issues"

# Listed explicitly: auto-discovery would trip over the tests, notebooks and the
# data/models directories that live beside the package.
[tool.setuptools]
packages = [
    "apexgpt",
    "apexgpt.api",
    "apexgpt.core",
    "apexgpt.features",
    "apexgpt.features.data",
    "apexgpt.features.hub",
    "apexgpt.features.inference",
    "apexgpt.features.training",
    "apexgpt.models",
    "apexgpt.tools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"